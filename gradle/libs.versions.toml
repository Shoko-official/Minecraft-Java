[versions]
spotless = "8.10.4"
googleJavaFormat = "1.36.1"
errorprone-plugin = "5.1.1"
errorprone = "2.51.0"
checkstyle = "14.3.0"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
gson = "2.14.0"

[libraries]
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
